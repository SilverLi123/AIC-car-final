# Fork-map unified YOLO OPT4 F4 (S044 single-variable A/B: earlier/tighter T-junction merge trigger & turn)
line_follower_node:
  ros__parameters:
    image_topic: "/image_raw"
    cmd_vel_topic: "/cmd_vel"
    avoid_cmd_topic: "/cmd_vel_avoid"
    detection_cmd_topic: "/cmd_vel_detection"
    debug_image_topic: "line_follower/debug_image"
    line_state_topic: "line_follower/track_state"
    start_topic: "line_follower/start_cmd"
    stop_cmd_topic: "/cmd_vel_stop"
    line_centroid_topic: "line_follower/centroid"

    target_speed: 0.44
    max_speed: 0.52
    min_speed: 0.0
    max_yaw_rate: 1.85
    kp: 2.65
    kd: 0.18

    roi_top_ratio: 0.58
    roi_bottom_ratio: 0.12
    gaussian_kernel: 5
    binary_threshold: 160.0
    morph_kernel: 3
    morph_iterations: 2
    min_contour_area: 2500.0
    invert_binary: false

    use_white_filter: true
    white_h_low: 0
    white_h_high: 180
    white_s_max: 45
    white_v_min: 80

    use_yellow_filter: true
    yellow_h_low: 20
    yellow_h_high: 40
    yellow_s_min: 80
    yellow_v_min: 120
    yellow_area_ratio_threshold: 0.02
    yellow_stop_duration: 1.0
    yellow_permanent_count: 4
    yellow_clear_frames: 10
    enable_reverse_brake: true
    odom_topic: "/odom"
    reverse_speed: -0.35
    reverse_max_duration: 0.45
    reverse_cutoff_speed: 0.10
    reverse_abort_speed: 0.01
    reverse_odom_timeout: 0.20

    base_far_weight: 0.24
    enable_intersection_probe: false
    enable_continuous_curve_assist: true
    reverse_curve_min_error: 0.12
    reverse_curve_threshold: 0.35
    reverse_curve_confirm_frames: 3
    reverse_curve_clear_frames: 4
    reverse_curve_speed: 0.23
    sharp_curve_threshold: 0.38
    sharp_curve_speed: 0.27
    enable_curve_preview_steering: true
    curve_preview_max_far_weight: 0.45
    curve_preview_yaw_slew_rate: 7.0

    enable_red_filter: true
    red_h_low_1: 0
    red_h_high_1: 10
    red_h_low_2: 160
    red_h_high_2: 180
    red_s_min: 90
    red_v_min: 70
    red_area_ratio_threshold: 0.0035
    red_divider_angle_deg: 8.0
    red_vote_frames: 2
    red_line_aspect_ratio_min: 3.0
    red_line_min_width_ratio: 0.30
    red_line_fallback_direction: -1
    red_line_soft_yaw: 0.24
    red_line_speed: 0.12
    red_cone_area_ratio_threshold: 0.0006
    red_cone_min_bbox_width: 4
    red_cone_min_bbox_height: 4

    enable_soft_red_avoidance: true
    red_soft_yaw: 0.21
    red_repulsion_gain: 0.95
    red_near_ratio: 0.18
    red_very_close_ratio: 0.72
    red_corridor_half_width_ratio: 0.30
    red_soft_curve_yaw_limit: 0.32
    red_lane_keep_min_factor: 0.68
    red_edge_guard_start_error: 0.14
    red_edge_guard_full_error: 0.28
    red_edge_guard_min_repulsion: 0.02
    enable_red_zone_cluster: true
    red_zone_min_width_ratio: 0.10
    red_zone_min_pixels: 120
    red_zone_near_ratio: 0.22
    red_zone_soft_yaw: 0.20
    red_latch_clear_frames: 7
    red_soft_speed: 0.24
    red_min_forward_speed: 0.14
    red_enable_intrusion_scaling: true
    red_cone_clear_margin: 0.20
    red_zone_clear_margin: 0.18
    red_intrusion_full_ratio: 0.38
    red_zone_return_yaw_limit: 0.20
    red_cone_return_yaw_limit: 0.34
    red_avoid_yaw_slew_rate: 3.4
    red_avoid_release_hold_sec: 0.48
    red_roi_top_ratio: 0.44
    red_avoid_max_yaw_rate: 1.12
    red_avoid_max_lat_accel: 0.34
    red_avoid_highspeed_slew_ref_speed: 0.30

    enable_tjunction_merge: true
    tjunction_require_branch_gate: true
    tjunction_arm_yellow_count: 2
    tjunction_branch_trigger_sign: -1
    tjunction_merge_direction: -1
    tjunction_min_arm_dist: 1.25
    tjunction_min_arm_time: 1.6
    tjunction_confirm_frames: 1
    tjunction_max_upper_road_ratio: 0.40
    tjunction_min_wide_row_ratio: 0.22
    tjunction_min_row_span_ratio: 0.65
    tjunction_left_edge_max_ratio: 0.22
    tjunction_right_edge_min_ratio: 0.78
    tjunction_min_top_dark_ratio: 0.70
    tjunction_rescue_upper_road_ratio: 0.12
    tjunction_rescue_total_road_ratio: 0.28
    tjunction_merge_speed: 0.22
    tjunction_merge_yaw_rate: 1.75
    tjunction_min_turn_duration: 1.15
    tjunction_max_turn_duration: 2.80
    tjunction_exit_upper_road_ratio: 0.55
    tjunction_exit_max_wide_row_ratio: 1.01

    line_lost_stop_time: 0.8
    line_lost_forward_speed: 0.30
    line_lost_yaw_hold_factor: 0.85
    speed_gain_damping: 0.72
    publish_debug_image: true

detection_turn_controller:
  ros__parameters:
    detection_topic: "hobot_dnn_detection"
    state_topic: "line_follower/track_state"
    start_topic: "line_follower/start_cmd"
    cmd_vel_topic: "/cmd_vel_detection"
    det_frame_width: 640
    det_frame_height: 480
    confidence_threshold: 0.35
    frame_window: 3
    turn_cooldown: 1.0
    turn_duration: 0.38
    turn_linear: 0.30
    yaw_gain: 2.20
    max_yaw_rate: 1.25
    turn_direction_sign: -1.0
    y_align_tolerance: 0.025
    dual_track_hold_time: 0.30
    border_margin_x: 0.14
    border_early_margin: 0.05
    min_winner_share: 0.50
    min_winner_count: 3
    min_winner_conf: 0.55
    min_normal_dy_travel: 0.02
    min_border_obs: 4
    min_turn_x_diff: 0.06
    trigger_y_offset: 0.0
    enable_digit_centering: true
    require_start_signal: true
    line_centroid_topic: "line_follower/centroid"
    centroid_timeout: 0.5
    enable_robust_digit_decision: true
    robust_conf_threshold: 0.38
    trigger_y_min: 0.36
    trigger_y_max: 0.76
    vote_window_frames: 4
    min_votes: 2
    pair_x_sep_min: 0.12
    post_yellow_window_sec: 3.5
    pair_hold_sec: 0.45
    pair_release_y: 0.68
    slot_memory_sec: 0.80
    enforce_global_max_veto: true
    max_veto_min_conf: 0.60

cmd_mux_node:
  ros__parameters:
    stop_topic: "/cmd_vel_stop"
    stop_timeout: 0.15
    avoid_topic: "/cmd_vel_avoid"
    avoid_timeout: 0.12
    high_topic: "/cmd_vel_detection"
    high_timeout: 0.12
    low_topic: "/cmd_vel_follower"
    output_topic: "/cmd_vel"
