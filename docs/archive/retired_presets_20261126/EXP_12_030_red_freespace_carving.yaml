# 实验预设 12（0.30 m/s）：开启“白道自由空间雕刻避障”（位置无关红锥/红框避障）
# 开启开关：enable_red_freespace_carving=true, enable_red_zone_lock=true
# 适用场景：直道任意位置红锥、弯道内侧/外侧红锥、地上红框禁行区；不依靠固定走廊或开环斥力，沿无障碍最宽白道中心绕行。
line_follower_node:
  ros__parameters:
    image_topic: "/image_raw"
    cmd_vel_topic: "/cmd_vel"
    debug_image_topic: "line_follower/debug_image"
    line_state_topic: "line_follower/track_state"
    start_topic: "line_follower/start_cmd"
    stop_cmd_topic: "/cmd_vel_stop"
    line_centroid_topic: "line_follower/centroid"

    target_speed: 0.3
    max_speed: 0.4
    min_speed: 0.0
    max_yaw_rate: 1.5
    kp: 2.45
    kd: 0.0
    kd_lpf_alpha: 0.35
    kd_max_contribution: 0.45

    roi_top_ratio: 0.65
    roi_bottom_ratio: 0.20
    gaussian_kernel: 5
    binary_threshold: 160.0
    morph_kernel: 3
    morph_iterations: 2
    min_contour_area: 2500.0
    invert_binary: false

    use_white_filter: true
    white_h_low: 0
    white_h_high: 180
    white_s_max: 45
    white_v_min: 80

    use_yellow_filter: true
    yellow_h_low: 20
    yellow_h_high: 40
    yellow_s_min: 80
    yellow_v_min: 120
    yellow_area_ratio_threshold: 0.02
    yellow_stop_duration: 1.0
    yellow_permanent_count: 4
    yellow_clear_frames: 10

    # 实验功能（默认关闭）：黄线横向长条几何过滤 + /odom 停稳闭环确认
    enable_yellow_geo_filter: false
    yellow_min_width_ratio: 0.25
    yellow_min_aspect_ratio: 2.5
    enable_yellow_odom_stop_confirm: false
    yellow_still_speed_mps: 0.03
    yellow_still_hold_sec: 0.15
    yellow_stop_max_duration: 1.5

    enable_intersection_probe: false
    intersection_band_height: 50
    intersection_dark_ratio_threshold: 1.0
    intersection_turn_speed: 0.2
    intersection_turn_yaw_rate: 1.8
    intersection_turn_duration: 2.0
    intersection_cooldown: 2.0

    enable_continuous_curve_assist: true
    reverse_curve_min_error: 0.12
    reverse_curve_threshold: 0.35
    reverse_curve_confirm_frames: 3
    reverse_curve_clear_frames: 4
    reverse_curve_speed: 0.16

    sharp_curve_threshold: 0.50
    sharp_curve_speed: 0.20

    # ================================
    # 红色目标基础 HSV
    # ================================
    enable_red_filter: true
    red_h_low_1: 0
    red_h_high_1: 10
    red_h_low_2: 160
    red_h_high_2: 180
    red_s_min: 90
    red_v_min: 70

    red_area_ratio_threshold: 0.0035
    red_divider_angle_deg: 8.0
    red_vote_frames: 3

    red_turn_yaw: 0.4
    red_turn_linear: 0.3
    red_turn_duration: 0.2

    red_line_aspect_ratio_min: 3.0
    red_line_min_width_ratio: 0.30

    red_line_fallback_direction: -1
    red_line_soft_yaw: 0.22
    red_line_speed: 0.15

    # 红框聚类同样协助 carving 把空心框整块挖黑
    enable_red_zone_lock: true
    red_zone_close_kernel_w: 21
    red_zone_close_kernel_h: 21
    red_zone_min_width_ratio: 0.16
    red_zone_aspect_ratio_min: 0.5
    red_zone_aspect_ratio_max: 4.5
    red_zone_lock_clear_frames: 6
    enable_red_white_width_side: false
    red_white_side_margin_px: 10.0

    # 实验功能（EXP_12 主开关）：白道自由空间雕刻避障
    enable_red_freespace_carving: true
    red_carve_pad_x_far: 38
    red_carve_pad_x_near: 85
    red_carve_trigger_bottom_ratio: 0.22
    red_carve_extend_down_ratio: 0.68
    red_carve_hold_frames: 5
    red_carve_hysteresis_ratio: 0.80

    # 单个红锥轮廓阈值
    red_cone_area_ratio_threshold: 0.0006
    red_cone_min_bbox_width: 4
    red_cone_min_bbox_height: 4

    # 在 carving 模式下主要用于近场平滑限速区间 [red_near_ratio..red_very_close_ratio]
    enable_soft_red_avoidance: true
    red_soft_yaw: 0.15
    red_repulsion_gain: 1.50
    red_near_ratio: 0.38
    red_very_close_ratio: 0.72
    red_corridor_half_width_ratio: 0.25
    red_soft_curve_yaw_limit: 0.15
    red_lane_keep_min_factor: 0.40
    red_edge_guard_start_error: 0.06
    red_edge_guard_full_error: 0.16
    red_soft_speed: 0.25
    red_min_forward_speed: 0.15

    line_lost_stop_time: 0.8
    line_lost_forward_speed: 0.3
    line_lost_yaw_hold_factor: 0.85
    speed_gain_damping: 0.65
    publish_debug_image: true
    debug_image_mode: "always"
    reuse_process_hsv_for_red: false

    enable_yolo_digit_masking: false
    digit_mask_apply_to_yellow: false
    digit_detection_topic: "/hobot_dnn_detection"
    digit_mask_timeout: 0.10
    digit_mask_min_conf: 0.40
    digit_mask_pad_px: 8

detection_turn_controller:
  ros__parameters:
    detection_topic: "hobot_dnn_detection"
    state_topic: "line_follower/track_state"
    cmd_vel_topic: "/cmd_vel_detection"
    det_frame_width: 640
    det_frame_height: 480
    confidence_threshold: 0.1
    frame_window: 2
    turn_cooldown: 0.8
    turn_duration: 0.38
    turn_linear: 0.20
    yaw_gain: 1.6
    max_yaw_rate: 1.3
    turn_direction_sign: -1.0
    y_align_tolerance: 0.01
    line_centroid_topic: "line_follower/centroid"
    centroid_timeout: 0.5

    enable_robust_digit_decision: false
    robust_conf_threshold: 0.45
    trigger_y_min: 0.32
    trigger_y_max: 0.78
    vote_window_frames: 4
    min_votes: 2
    pair_x_sep_min: 0.12
    post_yellow_window_sec: 3.5
    straight_turn_linear: 0.25
    straight_max_yaw_rate: 0.55
    straight_turn_duration: 0.25
    close_loop_x_tol: 0.08
    close_loop_y_min: 0.72
    missing_finish_frames: 2

cmd_mux_node:
  ros__parameters:
    stop_topic: "/cmd_vel_stop"
    stop_timeout: 0.5
    high_topic: "/cmd_vel_detection"
    high_timeout: 0.12
    low_topic: "/cmd_vel_follower"
    output_topic: "/cmd_vel"
    session_cooldown: 2.0
